<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 76" width="260" height="76">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Syne:wght@800&amp;family=DM+Sans:wght@700&amp;display=swap');
    </style>
  </defs>

  <!-- Diamond badge mark -->
  <g transform="translate(38,38)">
    <!-- Outer diamond - navy fill, white stroke -->
    <polygon points="0,-34 34,0 0,34 -34,0"
             fill="#0A2342" stroke="white" stroke-width="2.5"/>
    <!-- Inner diamond - white fill -->
    <polygon points="0,-20 20,0 0,20 -20,0"
             fill="white"/>

    <!-- WORK text on top-left diagonal -->
    <text transform="rotate(-45) translate(0,-26)"
          text-anchor="middle"
          font-family="'DM Sans', Arial Black, sans-serif"
          font-weight="800"
          font-size="7"
          fill="white"
          letter-spacing="1.8">WORK</text>

    <!-- SIMPLR text on top-right diagonal -->
    <text transform="rotate(45) translate(0,-26)"
          text-anchor="middle"
          font-family="'DM Sans', Arial Black, sans-serif"
          font-weight="800"
          font-size="7"
          fill="white"
          letter-spacing="1.2">SIMPLR</text>
  </g>

  <!-- Divider line -->
  <line x1="84" y1="14" x2="84" y2="62" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Wordmark: WORK -->
  <text x="96" y="33"
        font-family="'Syne', Arial Black, sans-serif"
        font-weight="800"
        font-size="21"
        fill="white"
        letter-spacing="1">WORK</text>

  <!-- Wordmark: SIMPLR in orange -->
  <text x="96" y="58"
        font-family="'Syne', Arial Black, sans-serif"
        font-weight="800"
        font-size="21"
        fill="#E07B39"
        letter-spacing="1">SIMPLR</text>
</svg>
